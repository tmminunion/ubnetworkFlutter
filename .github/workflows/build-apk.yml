name: Build UBnetwork Flutter Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play Track (pilih none untuk skip upload Play Store)'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
          - none
      play_status:
        description: 'Status rilis Play Store'
        required: true
        type: choice
        default: 'completed'
        options:
          - completed
          - draft
      release_notes:
        description: 'Catatan rilis (opsional)'
        required: false
        type: string
        default: 'Pembaruan fitur Record Daily Control, kanvas lembar kerja digital interaktif, manajemen aktivitas harian, sinkronisasi cloud, serta peningkatan performa aplikasi.'

concurrency:
  group: build-ubnetwork-flutter-apk-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Analyze, Test & Build UBnetwork Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Read Version Metadata
        id: meta
        run: |
          VER_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BASE_NAME=${VER_RAW%%+*}
          BASE_CODE=${VER_RAW##*+}
          IFS='.' read -r VER_MAJOR VER_MINOR VER_PATCH <<< "$BASE_NAME"
          VER_MAJOR=${VER_MAJOR:-1}
          VER_MINOR=${VER_MINOR:-0}
          VER_PATCH=${VER_PATCH:-0}
          TOTAL_STEPS=$(( 10#$VER_MAJOR * 1000 + 10#$VER_MINOR * 100 + 10#$VER_PATCH + GITHUB_RUN_NUMBER ))
          CALC_MAJOR=$(( TOTAL_STEPS / 1000 ))
          REM_MAJOR=$(( TOTAL_STEPS % 1000 ))
          CALC_MINOR=$(( REM_MAJOR / 100 ))
          CALC_PATCH=$(( REM_MAJOR % 100 ))
          VER_NAME="${CALC_MAJOR}.${CALC_MINOR}.${CALC_PATCH}"
          VER_CODE=$(( 10#$BASE_CODE + GITHUB_RUN_NUMBER ))
          echo "Resolved build version: v${VER_NAME} (code ${VER_CODE})"
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Android Project
        run: |
          rm -rf android /tmp/ubnet_tpl
          flutter create /tmp/ubnet_tpl --project-name apps --org com.ubnetwork --platforms=android
          cp -r /tmp/ubnet_tpl/android ./android
          rm -rf /tmp/ubnet_tpl

          python3 - <<'PYEOF'
          import re

          mpath = "android/app/src/main/AndroidManifest.xml"
          m = open(mpath, "r", encoding="utf-8").read()
          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="UBnetwork"', m)
          open(mpath, "w", encoding="utf-8").write(m)
          PYEOF

      - name: Install Dependencies & Generate App Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Configure Release Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; skipping release signing."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PYEOF'
          import os

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              txt = open(kts_path, "r", encoding="utf-8").read()
              header = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  "val keystoreProperties = Properties()\n"
                  "val keystorePropertiesFile = rootProject.file(\"key.properties\")\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              if "keystorePropertiesFile" not in txt:
                  txt = header + txt
              signing_block = (
                  "    signingConfigs {\n"
                  "        create(\"release\") {\n"
                  "            keyAlias = keystoreProperties.getProperty(\"keyAlias\")\n"
                  "            keyPassword = keystoreProperties.getProperty(\"keyPassword\")\n"
                  "            storeFile = keystoreProperties.getProperty(\"storeFile\")?.let { file(it) }\n"
                  "            storePassword = keystoreProperties.getProperty(\"storePassword\")\n"
                  "        }\n"
                  "    }\n\n"
                  "    buildTypes {"
              )
              if "create(\"release\")" not in txt:
                  txt = txt.replace("    buildTypes {", signing_block, 1)
              txt = txt.replace(
                  "signingConfig = signingConfigs.getByName(\"debug\")",
                  "signingConfig = signingConfigs.getByName(\"release\")"
              )
              open(kts_path, "w", encoding="utf-8").write(txt)
              print("Configured release signing in build.gradle.kts")
          elif os.path.exists(groovy_path):
              txt = open(groovy_path, "r", encoding="utf-8").read()
              header = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              if "keystorePropertiesFile" not in txt:
                  txt = header + txt
              signing_block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n\n"
                  "    buildTypes {"
              )
              if "signingConfigs {" not in txt:
                  txt = txt.replace("    buildTypes {", signing_block, 1)
              txt = txt.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              open(groovy_path, "w", encoding="utf-8").write(txt)
              print("Configured release signing in build.gradle")
          PYEOF

      - name: Build Signed Release APK & AAB (Play Store)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.retry.maxRetries=5 -Dorg.gradle.internal.http.retry.initialBackoff=3000
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release \
              --build-name="${{ steps.meta.outputs.version_name }}" \
              --build-number="${{ steps.meta.outputs.version_code }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Retrying APK build after transient network/Maven error (attempt $attempt)..."
            sleep 10
          done
          cp build/app/outputs/flutter-apk/app-release.apk "UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"

          flutter build appbundle --release \
            --build-name="${{ steps.meta.outputs.version_name }}" \
            --build-number="${{ steps.meta.outputs.version_code }}"
          cp build/app/outputs/bundle/release/app-release.aab "UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}+${{ steps.meta.outputs.version_code }}
          name: UBnetwork v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          files: |
            UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk
            UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab

      - name: Validate Play Store Credentials & Notes
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
        id: play_prep
        env:
          SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          RAW_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON belum diisi di repository tmminunion/ubnetworkFlutter!"
            exit 1
          fi

          if [ -n "$RAW_NOTES" ]; then
            mkdir -p /tmp/play-whatsnew
            printf '%s\n' "$RAW_NOTES" > /tmp/play-whatsnew/whatsnew-id
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish AAB to Google Play Store (with Release Notes)
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' && steps.play_prep.outputs.has_notes == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.ubnetwork.apps
          releaseFiles: UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          whatsNewDirectory: /tmp/play-whatsnew

      - name: Publish AAB to Google Play Store
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' && steps.play_prep.outputs.has_notes != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.ubnetwork.apps
          releaseFiles: UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}

      - name: Sync Global Store Listing Description to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
        env:
          SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PYEOF'
          import json
          import os
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          sa_raw = os.environ.get("SA_JSON", "").strip()
          if not sa_raw:
              print("No SA_JSON; skipping listing sync.")
              raise SystemExit(0)

          creds = service_account.Credentials.from_service_account_info(
              json.loads(sa_raw),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          creds.refresh(Request())
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json",
          }
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.ubnetwork.apps/edits"

          try:
              r_edit = requests.post(base, headers=headers, json={}, timeout=30)
              r_edit.raise_for_status()
              edit_id = r_edit.json()["id"]

              r_list = requests.get(f"{base}/{edit_id}/listings", headers=headers, timeout=30)
              r_list.raise_for_status()
              listings = r_list.json().get("listings", [])
              langs = [item.get("language") for item in listings if item.get("language")] or ["id"]
              titles = {item.get("language"): item.get("title") for item in listings if item.get("language")}

              id_short = "Aplikasi Record Daily Control, lembar kerja digital interaktif & ekspor PDF."
              id_full = (
                  "UBnetwork adalah aplikasi utilitas Record Daily Control dan manajemen lembar kerja digital interaktif "
                  "berbasis offline-first untuk pencatatan aktivitas harian, pemantauan target berkala, kolaborasi tim, "
                  "dan dokumentasi kerja terstruktur.\n\n"
                  "Fitur Utama:\n"
                  "• Record Daily Control (Kanvas Lembar Kerja Digital): Navigasi kanvas interaktif dengan fitur cubit dua jari "
                  "(pinch-to-zoom), geser bebas ke segala arah, kontrol presisi ukuran layar, serta tampilan lembar kerja yang rapi dan responsif.\n"
                  "• Pencatatan Langsung & Praktis: Ketuk langsung pada kolom lembar kerja untuk mencatat rencana harian, "
                  "capaian aktual, kehadiran anggota tim, evaluasi kendala, serta catatan tindak lanjut.\n"
                  "• Manajemen Aktivitas & Kolaborasi: Dilengkapi papan catatan tugas harian, jadwal kegiatan berkala, "
                  "evaluasi peningkatan berkelanjutan, serta pengelolaan dokumen kerja dalam satu aplikasi terpadu.\n"
                  "• Offline-First & Sinkronisasi Cloud: Data tersimpan otomatis di perangkat meskipun tanpa koneksi internet "
                  "dan dapat disinkronkan secara aman ke cloud kapan saja.\n"
                  "• Ekspor & Cetak Dokumen PDF: Ekspor lembar kerja harian langsung ke format dokumen PDF beresolusi tinggi "
                  "yang siap dibagikan atau dicetak."
              )

              en_short = "Record Daily Control app with interactive digital worksheet, sync & PDF export."
              en_full = (
                  "UBnetwork is an offline-first Record Daily Control utility and interactive digital worksheet hub designed for "
                  "structured daily activity tracking, periodic goal monitoring, team collaboration, and document management.\n\n"
                  "Key Features:\n"
                  "• Record Daily Control (Interactive Digital Canvas): Smooth pinch-to-zoom, free panning, precision zoom controls, "
                  "and a responsive digital worksheet interface.\n"
                  "• Direct Tap-to-Edit Recording: Tap any worksheet field to log daily plans, actual progress, team attendance, "
                  "issue tracking, and follow-up notes.\n"
                  "• Daily Task & Activity Hub: Includes sticky task boards, periodic schedules, continuous improvement tracking, "
                  "and document organization in one unified workspace.\n"
                  "• Offline-First & Cloud Sync: Records are saved locally on your device automatically and can be synced securely "
                  "when connected online.\n"
                  "• High-Resolution PDF Export: Export and print clean daily control worksheets directly to PDF."
              )

              for lang in langs:
                  is_en = lang.lower().startswith("en")
                  body = {
                      "language": lang,
                      "title": titles.get(lang) or "UBnetwork",
                      "shortDescription": en_short if is_en else id_short,
                      "fullDescription": en_full if is_en else id_full,
                  }
                  ru = requests.put(f"{base}/{edit_id}/listings/{lang}", headers=headers, json=body, timeout=30)
                  ru.raise_for_status()
                  print(f"Updated Google Play Store listing for language: {lang}")

              rc = requests.post(f"{base}/{edit_id}:commit", headers=headers, timeout=30)
              if rc.status_code == 400 and "changesNotSentForReview" in rc.text:
                  rc = requests.post(
                      f"{base}/{edit_id}:commit?changesNotSentForReview=true",
                      headers=headers,
                      timeout=30,
                  )
              rc.raise_for_status()
              print("Successfully committed global Store Listing description to Google Play!")
          except Exception as exc:
              print(f"::warning::Store listing sync warning (AAB upload unaffected): {exc}")
          PYEOF

      - name: Send APK & AAB Link to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_FILE: "UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"
          AAB_FILE: "UBnetwork-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab"
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.meta.outputs.version_name }}+${{ steps.meta.outputs.version_code }}"
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Secret Telegram belum diset; melewati notifikasi."
            exit 0
          fi

          if [ -f "$APK_FILE" ] && [ -f "$AAB_FILE" ]; then
            APK_MB=$(awk "BEGIN {printf \"%.2f\", $(wc -c < "$APK_FILE")/1048576}")
            AAB_MB=$(awk "BEGIN {printf \"%.2f\", $(wc -c < "$AAB_FILE")/1048576}")
            MSG=$(printf "🚀 UBnetwork Flutter v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }}) berhasil dibuild!\n📱 APK: %s (%s MB)\n🏪 AAB (Play Store): %s (%s MB)\n📥 Release: %s" "${APK_FILE}" "${APK_MB}" "${AAB_FILE}" "${AAB_MB}" "${RELEASE_URL}")
          else
            MSG="❌ Build UBnetwork Flutter v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }}) gagal menghasilkan file APK/AAB."
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null

      - name: Cleanup Temporary Files & Workflow Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf build android /tmp/ubnet_tpl *.apk *.aab
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for AID in $ARTIFACT_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${AID}" >/dev/null 2>&1 || true
          done
